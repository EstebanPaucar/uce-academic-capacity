server {
    listen 80;
    server_name localhost;

    # 1. Configuración para el Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto permite que React maneje las rutas sin dar 404
        try_files $uri $uri/ /index.html;
    }

    # 2. Configuración para el Auth Service
    # Todo lo que vaya a /api/auth se redirige al contenedor auth-service-prod
    location /api/auth/ {
        # IMPORTANTE: Usamos el nombre del contenedor y el puerto INTERNO (3000)
        proxy_pass http://auth-service-prod:3000/api/auth/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Configuración para Structure/Analytics Service
    # Ajusta esto si tienes otros microservicios. 
    # Por el log vi que usas /api/structure, asumo que va al academic-service
    location /api/structure/ {
        # Si el contenedor se llama 'academic-structure-service', usa ese nombre
        proxy_pass http://academic-structure-service:3000/api/structure/;
        
        proxy_set_header Host $host;
    }
    
    # Si tienes un servicio general para el resto de /api/
    # location /api/ {
    #    proxy_pass http://analytics-service-prod:3000/api/;
    # }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}